[project]
name = "minecraft-panel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2,<3",
    "alembic",
    "argon2-cffi",
    "python-dotenv",
    "websockets",
    "pillow",
    "javaproperties",
]

[dependency-groups]
dev = ["pytest", "httpx2", "ruff", "mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "javaproperties"
ignore_missing_imports = true
